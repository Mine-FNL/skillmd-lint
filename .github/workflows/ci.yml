name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test + Coverage (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=100
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  smoke:
    name: CLI smoke (real SKILL.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Lint a real SKILL.md
        run: |
          mkdir -p /tmp/smoke && cat > /tmp/smoke/SKILL.md <<'EOF'
          ---
          name: smoke-skill
          description: >-
            Use when verifying the skillmd-lint CLI smoke path on CI. Applies
            when a maintainer needs a known-good SKILL.md to lint. Do not use
            for production skill authoring or as a template for real skills.
          skill_type: specialist
          domain_focus: developer-tooling
          tags:
            - ci
            - linting
            - smoke-test
          version: 1.0.0
          version_notes: Initial 1.0.0 smoke fixture for the CLI smoke job.
          token_budget: 1200
          ---

          ## When to use

          Use this fixture when the CI smoke job needs a SKILL.md file that
          passes every rule under `--strict --schema`. It exists to prove the
          installed CLI can lint a real file end to end, not to teach skill
          authoring.

          ## Examples

          Run the linter against this fixture:

          ```bash
          skillmd-lint --strict --schema /tmp/smoke
          ```

          A clean run exits zero and prints the summary line:

          ```
          1 file(s) checked, 0 error(s), 0 warning(s)
          ```

          ## Pitfalls to avoid

          Do not add new sections or shorten the body below the spec minimum;
          the fixture must stay warning-free or the smoke job fails for the
          wrong reason.
          EOF
          python -m skillmd_lint /tmp/smoke
          python -m skillmd_lint --strict /tmp/smoke
          python -m skillmd_lint --format json /tmp/smoke
          python -m skillmd_lint --schema /tmp/smoke
          python -m skillmd_lint --list-rules

  release:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: pip install build && python -m build --sdist --wheel
      - name: Verify wheel installs and lints
        run: |
          pip install dist/skillmd_lint-*.whl
          skillmd-lint --version
          skillmd-lint examples/*/