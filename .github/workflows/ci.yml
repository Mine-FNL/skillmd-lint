name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test + Coverage (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-cov ruff
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=100
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  smoke:
    name: CLI smoke (real SKILL.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Lint a real SKILL.md
        run: |
          mkdir -p /tmp/smoke && cat > /tmp/smoke/SKILL.md <<'EOF'
          ---
          name: smoke-skill
          description: |
            Use when testing the CLI smoke path on CI. Don't use for
            production skill authoring.
          skill_type: specialist
          ---
          # Smoke

          ## When to use

          ## Examples

          ## Pitfalls to avoid
          EOF
          python -m skillmd_lint /tmp/smoke
          python -m skillmd_lint --strict /tmp/smoke
          python -m skillmd_lint --format json /tmp/smoke
          python -m skillmd_lint --schema /tmp/smoke
          python -m skillmd_lint --list-rules

  release:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: pip install build && python -m build --sdist --wheel
      - name: Verify wheel installs and lints
        run: |
          pip install dist/skillmd_lint-*.whl
          skillmd-lint --version
          skillmd-lint examples/