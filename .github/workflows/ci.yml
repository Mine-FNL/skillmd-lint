name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-cov ruff
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run on a real skill
        run: |
          mkdir -p /tmp/smoke && cat > /tmp/smoke/SKILL.md <<'EOF'
          ---
          name: smoke-skill
          description: |
            Use when testing the CLI smoke path. Don't use for production.
          ---
          # Smoke

          ## When to use

          For example, this skill exists only to verify the CLI runs end-to-end.
          EOF
          python -m skillmd_lint /tmp/smoke
